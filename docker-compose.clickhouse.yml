# ClickHouse is the analytics/usage backend variant. PostgreSQL remains required
# for transactional tenants, credentials, API keys, models, routes, and prices.
services:
  gorouter:
    build: .
    restart: unless-stopped
    environment:
      MASTER_KEY: "${MASTER_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      LISTEN: ":8090"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      USAGE_BACKEND: "clickhouse"
    ports:
      - "${ROUTER_BIND_IP:-127.0.0.1}:${ROUTER_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-gorouter}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-gorouter}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    ports:
      - "${CLICKHOUSE_BIND_IP:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8124}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9001}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./platform/database/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
