# ClickHouse is the complete primary store in this deployment variant.
services:
  gorouter:
    build: .
    restart: unless-stopped
    environment:
      MASTER_KEY: "${MASTER_KEY}"
      LISTEN: ":8090"
      DB_BACKEND: "clickhouse"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-gorouter}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-gorouter}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_USER: "${REDIS_USER:-gorouter}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      APP_ENV: "production"
      API_TOKEN_CACHE_TTL: "${API_TOKEN_CACHE_TTL:-10m}"
      WEEK_START: "${WEEK_START:-sunday}"
      USAGE_WRITE_CONCURRENCY: "${USAGE_WRITE_CONCURRENCY:-4}"
      USAGE_WRITE_QUEUE_SIZE: "${USAGE_WRITE_QUEUE_SIZE:-100000}"
      ANTHROPIC_OAUTH_CLIENT_ID: "${ANTHROPIC_OAUTH_CLIENT_ID:-9d1c250a-e61b-44d9-88ed-5944d1962f5e}"
      ANTHROPIC_OAUTH_TOKEN_URL: "${ANTHROPIC_OAUTH_TOKEN_URL:-}"
      CODEX_OAUTH_CLIENT_ID: "${CODEX_OAUTH_CLIENT_ID:-app_EMoamEEZ73f0CkXaXp7hrann}"
      CODEX_OAUTH_TOKEN_URL: "${CODEX_OAUTH_TOKEN_URL:-}"
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:-Iv1.b507a08c87ecfe98}"
      GROK_OAUTH_CLIENT_ID: "${GROK_OAUTH_CLIENT_ID:-b1a00492-073a-47ea-816f-4c329264a828}"
      KIMI_CODING_OAUTH_CLIENT_ID: "${KIMI_CODING_OAUTH_CLIENT_ID:-17e5f671-d194-4dfb-9706-5516cb48c098}"
      ANTIGRAVITY_OAUTH_CLIENT_ID: "${ANTIGRAVITY_OAUTH_CLIENT_ID:-1071006060591-tmhssin2h21lcre235vtolojh4g403ep.apps.googleusercontent.com}"
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: "${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-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}"
      OPENROUTER_CATALOG_ENABLED: "${OPENROUTER_CATALOG_ENABLED:-true}"
      OPENROUTER_CATALOG_URL: "${OPENROUTER_CATALOG_URL:-https://openrouter.ai/api/frontend/v1/catalog/models}"
      OPENROUTER_SYNC_INTERVAL: "${OPENROUTER_SYNC_INTERVAL:-1h}"
      OPENROUTER_HTTP_TIMEOUT: "${OPENROUTER_HTTP_TIMEOUT:-30s}"
    ports:
      - "${CLICKHOUSE_ROUTER_PORT:-18091}:8090"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --user
      - "${REDIS_USER:-gorouter}"
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~*"
      - "&*"
      - "+@all"
      - --user
      - default
      - "off"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${REDIS_USER:-gorouter}", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-gorouter}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-gorouter}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  clickhouse_data:
