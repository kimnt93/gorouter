<!doctype html><html>{{template "head" .}}<body>{{template "nav" .}}<main><div class="toolbar"><div><h1>Users</h1><p class="muted">Master-managed login identities.</p></div></div><section class="panel"><form class="fields" method="post" action="/ui/users"><label>Email username<input name="username" type="email" required autocomplete="off"></label><label><span>Create user</span><button class="primary" type="submit">Create user</button></label></form></section><div class="table" style="margin-top:16px"><table><thead><tr><th>Username</th><th>Status</th><th>Created</th></tr></thead><tbody>{{range .Users}}<tr><td>{{.Username}}</td><td><span class="badge">{{.Status}}</span></td><td><time datetime="{{rfc3339 .CreatedAt}}">{{rfc3339 .CreatedAt}}</time></td></tr>{{else}}<tr><td colspan="3" class="muted">No users</td></tr>{{end}}</tbody></table></div></main></body></html>
