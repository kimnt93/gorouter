<!doctype html><html>{{template "head" .}}<body>{{template "nav" .}}<main>
<div class="toolbar"><div><h1>Gateway console</h1><p class="muted">Role: <code>{{.Session.Role}}</code> · Scopes: {{range .Session.Scopes}}<span class="badge">{{.}}</span> {{end}}</p></div></div>
<section class="grid"><div class="card stat"><span class="muted">OpenAI endpoint</span><b>/v1/chat/completions</b></div><div class="card stat"><span class="muted">Authentication</span><b>Bearer API key</b></div><div class="card stat"><span class="muted">Cache isolation</span><b>Per key by default</b></div></section>
{{if .CanUsage}}<div hx-get="/ui/cache" hx-trigger="load, every 10s" hx-swap="outerHTML">{{template "cache.html" .Cache}}</div>{{end}}
</main></body></html>
