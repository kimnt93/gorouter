info:
  contact: {}
  description: Principal-aware model gateway and administration API.
  title: gorouter API
  version: "1.0"
paths:
  /admin/api-keys:
    get:
      description: Lists API-key metadata after applying principal ownership, organization
        context, status, and pagination filters.
      parameters:
      - description: user or organization
        in: query
        name: owner_type
        type: string
      - description: Owner user or organization ID
        in: query
        name: owner_id
        type: string
      - description: Context organization ID
        in: query
        name: organization_id
        type: string
      - description: Master-only user View As filter
        in: query
        name: view_user_id
        type: string
      - description: enabled or disabled
        in: query
        name: status
        type: string
      - description: Opaque cursor
        in: query
        name: cursor
        type: string
      - default: 100
        description: Page size
        in: query
        maximum: 500
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.APIKeyListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      description: Creates an owned API key and returns its plaintext secret exactly
        once in the response.
      parameters:
      - description: Key configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.APIKeyCreateRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api_handlers.CreatedAPIKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an API key
      tags:
      - api-keys
  /admin/api-keys/{id}:
    delete:
      description: Permanently deletes an API key after checking ownership and management
        permission.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.OKResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an API key
      tags:
      - api-keys
    patch:
      description: Changes mutable API-key policy fields such as enabled state, model
        allowlist, scopes, quota, and RPM.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      - description: Mutable key fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handlers.APIKeyPatchRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.OKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an API key
      tags:
      - api-keys
  /admin/api-keys/{id}/rotate:
    post:
      description: Replaces an API key secret and returns the new plaintext secret
        exactly once.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.CreatedAPIKeyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rotate an API key
      tags:
      - api-keys
  /admin/api-keys/models:
    get:
      description: Lists models that the current principal may assign to an API key,
        including effective pricing.
      parameters:
      - description: Target organization
        in: query
        name: organization_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.APIKeyModelOptionsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kimnt93_gorouter_internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List grantable API-key models
      tags:
      - api-keys
  /admin/audit/events:
    get:
      description: Returns policy-constrained, cursor-paginated administrative audit
        events.
      parameters:
      - description: Opaque cursor
        in: query
        name: cursor
        type: string
      - default: 100
        description: Page size
        in: query
        maximum: 500
        name: limit
        type: integer
      - description: RFC3339 lower time bound
        in: query
        name: since
        type: string
      - description: RFC3339 upper time bound
        in: query
        name: until
        type: string
      - description: Organization filter
        in: query
        name: organization_id
        type: string
      - description: Master-only user View As filter
        in: query
        name: view_user_id
        type: string
      - description: Actor ID
        in: query
        name: actor_id
        type: string
      - description: Action
        in: query
        name: action
        type: string
      - description: Target type
        in: query
        name: target_type
        type: string
      - description: Target ID
        in: query
        name: target_id
        type: string
      responses:
        "200":
