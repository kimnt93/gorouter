services:
  gorouter:
    build: .
    restart: unless-stopped
    environment:
      MASTER_KEY: "${MASTER_KEY}"
      LISTEN: ":8090"
      DB_BACKEND: "postgresql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_USER: "${REDIS_USER:-gorouter}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      APP_ENV: "production"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-5m}"
      REQUEST_LIMIT_MB: "${REQUEST_LIMIT_MB:-20}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_TTL: "${CACHE_TTL:-24h}"
      CACHE_SCOPE: "${CACHE_SCOPE:-key}"
      CACHE_MAX_ENTRY_BYTES: "${CACHE_MAX_ENTRY_BYTES:-1048576}"
      REDIS_OUTAGE_POLICY: "${REDIS_OUTAGE_POLICY:-strict}"
      ANTHROPIC_OAUTH_CLIENT_ID: "${ANTHROPIC_OAUTH_CLIENT_ID:-9d1c250a-e61b-44d9-88ed-5944d1962f5e}"
      ANTHROPIC_OAUTH_TOKEN_URL: "${ANTHROPIC_OAUTH_TOKEN_URL:-}"
    ports:
      - "${ROUTER_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --user
      - "${REDIS_USER:-gorouter}"
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~*"
      - "&*"
      - "+@all"
      - --user
      - default
      - "off"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${REDIS_USER:-gorouter}", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
