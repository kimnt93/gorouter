services:
  gorouter:
    build: .
    restart: unless-stopped
    environment:
      MASTER_KEY: "${MASTER_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      LISTEN: ":8090"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      APP_ENV: "production"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-5m}"
      REQUEST_LIMIT_MB: "${REQUEST_LIMIT_MB:-20}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_TTL: "${CACHE_TTL:-24h}"
      CACHE_SCOPE: "${CACHE_SCOPE:-key}"
      CACHE_MAX_ENTRY_BYTES: "${CACHE_MAX_ENTRY_BYTES:-1048576}"
      REDIS_OUTAGE_POLICY: "${REDIS_OUTAGE_POLICY:-strict}"
      ANTHROPIC_OAUTH_CLIENT_ID: "${ANTHROPIC_OAUTH_CLIENT_ID:-9d1c250a-e61b-44d9-88ed-5944d1962f5e}"
      ANTHROPIC_OAUTH_TOKEN_URL: "${ANTHROPIC_OAUTH_TOKEN_URL:-}"
    ports:
      - "${ROUTER_BIND_IP:-127.0.0.1}:${ROUTER_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-63899}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
