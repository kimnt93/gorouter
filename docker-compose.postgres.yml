services:
  gorouter:
    build: .
    restart: unless-stopped
    environment:
      MASTER_KEY: "${MASTER_KEY:-secret}"
      LISTEN: ":8090"
      DB_BACKEND: "postgresql"
      DB_CONNECTION_URL: "${DB_CONNECTION_URL:-postgres://gorouter:secret@postgres:5432/gorouter?sslmode=disable}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_USER: "${REDIS_USER:-gorouter}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-secret}"
      APP_ENV: "production"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-gorouter}"
      DEVELOPMENT_ENVIRONMENT: "${DEVELOPMENT_ENVIRONMENT:-local}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_TIME_FORMAT: "${LOG_TIME_FORMAT:-rfc3339}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      ROUTE_RETRIES: "${ROUTE_RETRIES:-2}"
      AUTO_MAX_TRIES: "${AUTO_MAX_TRIES:-3}"
      API_TOKEN_CACHE_TTL: "${API_TOKEN_CACHE_TTL:-10m}"
      WEEK_START: "${WEEK_START:-sunday}"
      USAGE_WRITE_CONCURRENCY: "${USAGE_WRITE_CONCURRENCY:-4}"
      USAGE_WRITE_QUEUE_SIZE: "${USAGE_WRITE_QUEUE_SIZE:-100000}"
      ENABLE_STORE_COMPLLETIONS: "${ENABLE_STORE_COMPLLETIONS:-false}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-5m}"
      REQUEST_LIMIT_MB: "${REQUEST_LIMIT_MB:-20}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_TTL: "${CACHE_TTL:-24h}"
      CACHE_SCOPE: "${CACHE_SCOPE:-key}"
      CACHE_MAX_ENTRY_BYTES: "${CACHE_MAX_ENTRY_BYTES:-1048576}"
      REDIS_OUTAGE_POLICY: "${REDIS_OUTAGE_POLICY:-strict}"
      ANTHROPIC_OAUTH_CLIENT_ID: "${ANTHROPIC_OAUTH_CLIENT_ID:-9d1c250a-e61b-44d9-88ed-5944d1962f5e}"
      ANTHROPIC_OAUTH_TOKEN_URL: "${ANTHROPIC_OAUTH_TOKEN_URL:-}"
      CODEX_OAUTH_CLIENT_ID: "${CODEX_OAUTH_CLIENT_ID:-app_EMoamEEZ73f0CkXaXp7hrann}"
      CODEX_OAUTH_TOKEN_URL: "${CODEX_OAUTH_TOKEN_URL:-}"
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:-Iv1.b507a08c87ecfe98}"
      GROK_OAUTH_CLIENT_ID: "${GROK_OAUTH_CLIENT_ID:-b1a00492-073a-47ea-816f-4c329264a828}"
      KIMI_CODING_OAUTH_CLIENT_ID: "${KIMI_CODING_OAUTH_CLIENT_ID:-17e5f671-d194-4dfb-9706-5516cb48c098}"
      ANTIGRAVITY_OAUTH_CLIENT_ID: "${ANTIGRAVITY_OAUTH_CLIENT_ID:-}"
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: "${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}"
      OPENROUTER_CATALOG_ENABLED: "${OPENROUTER_CATALOG_ENABLED:-true}"
      OPENROUTER_CATALOG_URL: "${OPENROUTER_CATALOG_URL:-https://openrouter.ai/api/frontend/v1/catalog/models}"
      OPENROUTER_SYNC_INTERVAL: "${OPENROUTER_SYNC_INTERVAL:-1h}"
      OPENROUTER_HTTP_TIMEOUT: "${OPENROUTER_HTTP_TIMEOUT:-30s}"
      MODEL_CATALOG_SYNC_ENABLED: "${MODEL_CATALOG_SYNC_ENABLED:-true}"
      MODEL_CATALOG_SYNC_INTERVAL: "${MODEL_CATALOG_SYNC_INTERVAL:-15m}"
      MODEL_CATALOG_CACHE_TTL: "${MODEL_CATALOG_CACHE_TTL:-1h}"
    ports:
      - "${ROUTER_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DB_CONNECTION_URL: "${DB_CONNECTION_URL:-postgres://gorouter:secret@postgres:5432/gorouter?sslmode=disable}"
    entrypoint: ["/gorouter-database-entrypoint.sh", "postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/database-entrypoint.sh:/gorouter-database-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --user
      - "${REDIS_USER:-gorouter}"
      - "on"
      - ">${REDIS_PASSWORD:-secret}"
      - "~*"
      - "&*"
      - "+@all"
      - --user
      - default
      - "off"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${REDIS_USER:-gorouter}", "--pass", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
